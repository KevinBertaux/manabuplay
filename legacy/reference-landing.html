<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManabuPlay — Learn Japanese Through Gaming</title>
  <meta name="description" content="Learn Japanese gaming vocabulary through an addictive quiz. Master the words behind your favorite anime & JRPG games. Free, fast, fun." />
  <meta name="keywords" content="Japanese gaming vocabulary, learn Japanese, anime words, JRPG quiz, gaming language" />
  <meta property="og:title" content="ManabuPlay — Learn Japanese Through Gaming" />
  <meta property="og:description" content="Master Japanese gaming vocab. Free addictive quiz powered by anime & JRPG culture." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0a0911" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/joystix" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: '#0a0911',
            violet:  { 400:'#a78bfa', 500:'#8b5cf6', 600:'#7c3aed' },
            fuchsia: { 300:'#f0abfc', 400:'#e879f9', 500:'#d946ef' },
            cyan:    { 400:'#22d3ee' }
          },
          fontFamily: {
            pixel: ['Joystix', 'sans-serif'],
            body:  ['Rajdhani', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --violet:#8b5cf6; --fuchsia:#e879f9; --cyan:#22d3ee; --void:#0a0911; --green:#4ade80; --red:#f87171; }
    html { scroll-behavior:smooth; font-size:17px; }
    body { background-color:var(--void); font-family:'Rajdhani',sans-serif; overflow-x:hidden; }

    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
      background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);
    }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9998; opacity:.4;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    .glow-violet  { text-shadow:0 0 8px var(--violet),0 0 24px var(--violet),0 0 48px rgba(139,92,246,.5); }
    .glow-fuchsia { text-shadow:0 0 8px var(--fuchsia),0 0 24px var(--fuchsia),0 0 48px rgba(232,121,249,.5); }
    .border-glow  { box-shadow:0 0 0 1px rgba(139,92,246,.4),0 0 16px rgba(139,92,246,.2),inset 0 0 16px rgba(139,92,246,.05); }

    .hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%,rgba(139,92,246,.25) 0%,transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 60%,rgba(232,121,249,.15) 0%,transparent 60%),
        radial-gradient(ellipse 40% 40% at 10% 80%,rgba(34,211,238,.10) 0%,transparent 60%),
        var(--void);
    }
    .grid-bg {
      background-image:linear-gradient(rgba(139,92,246,.07) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(139,92,246,.07) 1px,transparent 1px);
      background-size:60px 60px;
    }

    /* GLITCH */
    .glitch-text { position:relative; animation:glitch-self 3s infinite; }
    .glitch-text::before,.glitch-text::after { content:attr(data-text); position:absolute; top:0; left:0; width:100%; }
    .glitch-text::before { color:var(--fuchsia); animation:glitch-1 3s infinite; clip-path:polygon(0 0,100% 0,100% 45%,0 45%); }
    .glitch-text::after  { color:var(--cyan);    animation:glitch-2 3s infinite; clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%); }
    @keyframes glitch-self { 0%,89%,100%{transform:translate(0)} 90%{transform:translate(-2px,1px)} 92%{transform:translate(2px,-1px)} }
    @keyframes glitch-1 { 0%,88%,100%{transform:none;opacity:0} 90%{transform:translate(-4px,-2px);opacity:.8} 92%{transform:translate(4px,2px);opacity:.8} 94%{opacity:0} }
    @keyframes glitch-2 { 0%,88%,100%{transform:none;opacity:0} 91%{transform:translate(4px,2px);opacity:.7} 93%{transform:translate(-4px,-2px);opacity:.7} 95%{opacity:0} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    /* ANSWER BUTTONS */
    .answer-btn {
      background:rgba(26,22,48,.8); border:1px solid rgba(139,92,246,.3); color:#e2d9f3;
      padding:15px 20px; border-radius:8px; font-family:'Rajdhani',sans-serif;
      font-size:1.12rem; font-weight:600; cursor:pointer; transition:all .18s ease;
      text-align:left; width:100%; position:relative; overflow:hidden; line-height:1.4;
    }
    .answer-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--violet),var(--fuchsia)); opacity:0; transition:opacity .2s; }
    .answer-btn:hover:not(:disabled) { border-color:rgba(139,92,246,.8); box-shadow:0 0 16px rgba(139,92,246,.3); transform:translateX(4px); }
    .answer-btn:hover:not(:disabled)::before { opacity:.08; }
    .answer-btn span { position:relative; z-index:1; }
    .answer-btn.correct { border-color:var(--green)!important; background:rgba(74,222,128,.1)!important; box-shadow:0 0 16px rgba(74,222,128,.3)!important; color:var(--green)!important; }
    .answer-btn.wrong   { border-color:var(--red)!important;   background:rgba(248,113,113,.1)!important; box-shadow:0 0 12px rgba(248,113,113,.2)!important; color:var(--red)!important; }
    .answer-btn:disabled { cursor:not-allowed; }

    /* PROGRESS */
    .progress-bar { height:4px; background:linear-gradient(90deg,var(--violet),var(--fuchsia)); border-radius:2px; transition:width .4s ease; box-shadow:0 0 8px var(--violet); }

    /* CTA */
    .cta-btn {
      background:linear-gradient(135deg,var(--violet) 0%,var(--fuchsia) 100%);
      color:#fff; font-family:'Joystix',sans-serif; font-size:.8rem;
      padding:15px 30px; border-radius:6px; border:none; cursor:pointer;
      transition:all .2s ease; letter-spacing:1px;
      box-shadow:0 4px 24px rgba(139,92,246,.4),0 0 0 1px rgba(255,255,255,.1);
    }
    .cta-btn:hover  { transform:translateY(-2px); box-shadow:0 8px 32px rgba(139,92,246,.6),0 0 0 1px rgba(255,255,255,.2); }
    .cta-btn:active { transform:translateY(0); }

    /* EMAIL */
    .email-input {
      background:rgba(26,22,48,.9); border:1px solid rgba(139,92,246,.4); color:#e2d9f3;
      padding:15px 20px; border-radius:6px; font-family:'Rajdhani',sans-serif;
      font-size:1.1rem; font-weight:500; outline:none;
      transition:border-color .2s,box-shadow .2s; width:100%;
    }
    .email-input::placeholder { color:rgba(167,139,250,.4); }
    .email-input:focus { border-color:var(--violet); box-shadow:0 0 16px rgba(139,92,246,.2); }

    /* AD */
    .ad-placeholder {
      background:repeating-linear-gradient(45deg,rgba(139,92,246,.03),rgba(139,92,246,.03) 10px,rgba(232,121,249,.03) 10px,rgba(232,121,249,.03) 20px);
      border:1px dashed rgba(139,92,246,.25); border-radius:8px;
    }

    /* FEATURE CARD */
    .feature-card { background:rgba(26,22,48,.6); border:1px solid rgba(139,92,246,.2); backdrop-filter:blur(8px); border-radius:12px; transition:border-color .2s,transform .2s,box-shadow .2s; }
    .feature-card:hover { border-color:rgba(139,92,246,.5); transform:translateY(-4px); box-shadow:0 12px 40px rgba(139,92,246,.15); }

    /* SCORE POP */
    @keyframes scorePopIn { 0%{transform:scale(.5) rotate(-10deg);opacity:0} 70%{transform:scale(1.2) rotate(3deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    .score-pop { animation:scorePopIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }

    /* PARTICLES */
    @keyframes particle-fly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0} }
    .particle { position:fixed; width:6px; height:6px; border-radius:50%; pointer-events:none; animation:particle-fly .8s ease-out forwards; }

    /* HINT */
    .hint-reveal-btn {
      display:inline-flex; align-items:center; gap:7px;
      background:rgba(34,211,238,.07); border:1px solid rgba(34,211,238,.25);
      color:rgba(34,211,238,.7); font-family:'Rajdhani',sans-serif;
      font-size:1rem; font-weight:700; padding:7px 18px; border-radius:20px;
      cursor:pointer; transition:all .2s ease; letter-spacing:.06em; text-transform:uppercase;
    }
    .hint-reveal-btn:hover { background:rgba(34,211,238,.14); border-color:rgba(34,211,238,.55); color:var(--cyan); box-shadow:0 0 14px rgba(34,211,238,.18); }
    @keyframes hintReveal { 0%{opacity:0;transform:translateY(-8px) scale(.95);filter:blur(5px)} 100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
    .hint-revealed { animation:hintReveal .38s cubic-bezier(.22,1,.36,1) forwards; display:inline-block; }
    #hintContent { font-size:1.05rem; }

    /* LANG */
    .lang-btn {
      font-family:'Rajdhani',sans-serif; font-size:.9rem; font-weight:700; padding:4px 11px;
      border-radius:4px; border:1px solid transparent; cursor:pointer; transition:all .15s ease;
      letter-spacing:.08em; background:transparent; color:rgba(167,139,250,.45);
    }
    .lang-btn.active { border-color:rgba(139,92,246,.6); background:rgba(139,92,246,.12); color:#a78bfa; box-shadow:0 0 10px rgba(139,92,246,.2); }
    .lang-btn:not(.active):hover { color:rgba(167,139,250,.8); border-color:rgba(139,92,246,.2); }

    /* KANJI */
    .kanji-bg { position:absolute; font-size:10rem; opacity:.03; pointer-events:none; user-select:none; line-height:1; }
    @media(max-width:640px){ .kanji-bg{font-size:5rem;} }

    /* SCROLL REVEAL */
    .reveal { opacity:0; transform:translateY(30px); transition:opacity .6s ease,transform .6s ease; }
    .reveal.visible { opacity:1; transform:none; }

    /* TYPOGRAPHY CLASSES */
    .section-label    { font-family:'Joystix',sans-serif; font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; line-height:1.6; }
    .pixel-heading-sm { font-family:'Joystix',sans-serif; font-size:.95rem;  line-height:1.7; }
    .pixel-heading-md { font-family:'Joystix',sans-serif; font-size:1.1rem;  line-height:1.7; }
    .pixel-card-title { font-family:'Joystix',sans-serif; font-size:.8rem;   line-height:1.8; text-transform:uppercase; }
    .hud-label        { font-family:'Rajdhani',sans-serif; font-size:.9rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; }
    .progress-text    { font-family:'Joystix',sans-serif; font-size:.72rem; line-height:1.5; }
    .stat-label       { font-family:'Rajdhani',sans-serif; font-size:.85rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
    .nav-link         { font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700; }
    #wordKana         { font-family:'Joystix',sans-serif; font-size:.8rem; line-height:1.6; }
    #feedback         { font-family:'Joystix',sans-serif; font-size:.72rem; line-height:1.8; }
    .result-label     { font-family:'Rajdhani',sans-serif; font-size:.95rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; }

    /* ══ DIFFICULTY CARDS ══ */
    .diff-card {
      background:rgba(26,22,48,.7); border:2px solid rgba(139,92,246,.2);
      border-radius:12px; padding:20px 16px; cursor:pointer;
      transition:all .2s ease; text-align:center; position:relative; overflow:hidden;
    }
    .diff-card::before { content:''; position:absolute; inset:0; opacity:0; transition:opacity .2s; }
    .diff-card:hover { transform:translateY(-3px); }
    .diff-card.diff-easy:hover   { border-color:#4ade80; box-shadow:0 0 20px rgba(74,222,128,.2); }
    .diff-card.diff-normal:hover { border-color:var(--cyan); box-shadow:0 0 20px rgba(34,211,238,.2); }
    .diff-card.diff-hard:hover   { border-color:var(--fuchsia); box-shadow:0 0 20px rgba(232,121,249,.2); }
    .diff-card.diff-expert:hover { border-color:var(--red); box-shadow:0 0 20px rgba(248,113,113,.2); }
    .diff-card.selected.diff-easy   { border-color:#4ade80!important; background:rgba(74,222,128,.08)!important; box-shadow:0 0 24px rgba(74,222,128,.25)!important; }
    .diff-card.selected.diff-normal { border-color:var(--cyan)!important; background:rgba(34,211,238,.08)!important; box-shadow:0 0 24px rgba(34,211,238,.25)!important; }
    .diff-card.selected.diff-hard   { border-color:var(--fuchsia)!important; background:rgba(232,121,249,.08)!important; box-shadow:0 0 24px rgba(232,121,249,.25)!important; }
    .diff-card.selected.diff-expert { border-color:var(--red)!important; background:rgba(248,113,113,.08)!important; box-shadow:0 0 24px rgba(248,113,113,.25)!important; }

    .diff-icon { font-size:2rem; margin-bottom:8px; display:block; }
    .diff-name { font-family:'Joystix',sans-serif; font-size:.7rem; line-height:1.8; margin-bottom:6px; }
    .diff-count { font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700; opacity:.7; }
    .diff-best { font-family:'Rajdhani',sans-serif; font-size:.85rem; font-weight:600; margin-top:6px; }

    /* START BUTTON inside difficulty screen */
    .start-btn {
      background:linear-gradient(135deg,var(--violet) 0%,var(--fuchsia) 100%);
      color:#fff; font-family:'Joystix',sans-serif; font-size:.78rem;
      padding:14px 28px; border-radius:6px; border:none; cursor:pointer;
      transition:all .2s ease; letter-spacing:1px;
      box-shadow:0 4px 24px rgba(139,92,246,.4);
      opacity:.4; pointer-events:none;
      transition:opacity .2s, transform .2s, box-shadow .2s;
    }
    .start-btn.ready { opacity:1; pointer-events:auto; }
    .start-btn.ready:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(139,92,246,.6); }

    /* BEST SCORE badge in results */
    .new-record-badge {
      display:inline-block; font-family:'Joystix',sans-serif; font-size:.65rem;
      padding:4px 12px; border-radius:20px; margin-top:6px;
      background:rgba(74,222,128,.15); border:1px solid rgba(74,222,128,.5);
      color:#4ade80; animation:scorePopIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    /* ══ SHARE BUTTONS ══ */
    .share-btn {
      display:inline-flex; align-items:center; gap:8px;
      font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700;
      padding:10px 20px; border-radius:8px; border:none; cursor:pointer;
      transition:all .2s ease; letter-spacing:.04em;
    }
    .share-btn-x {
      background:#000; color:#fff;
      box-shadow:0 0 0 1px rgba(255,255,255,.15);
    }
    .share-btn-x:hover {
      background:#111; transform:translateY(-2px);
      box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.2);
    }
    .share-btn-copy {
      background:rgba(139,92,246,.15); color:#a78bfa;
      border:1px solid rgba(139,92,246,.35);
    }
    .share-btn-copy:hover {
      background:rgba(139,92,246,.25); transform:translateY(-2px);
      box-shadow:0 4px 16px rgba(139,92,246,.2);
    }
    .share-btn-copy.copied {
      background:rgba(74,222,128,.15); color:#4ade80;
      border-color:rgba(74,222,128,.4);
      box-shadow:0 0 12px rgba(74,222,128,.2);
    }
  </style>
</head>
<body class="text-slate-200">

  <!-- ══ NAV ══ -->
  <nav class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-6 py-2"
       style="background:rgba(10,9,17,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(139,92,246,.15);">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-md flex items-center justify-center text-white flex-shrink-0"
           style="background:linear-gradient(135deg,var(--violet),var(--fuchsia));">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="glow-violet" style="font-family:'Joystix',sans-serif;font-size:.85rem;color:#a78bfa;">
        Manabu<span style="color:#e879f9;">Play</span>
      </span>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1 px-2 py-1 rounded-md" style="background:rgba(26,22,48,.8);border:1px solid rgba(139,92,246,.15);">

      <a href="#quiz" class="nav-link px-4 py-2 rounded-md border border-violet-500/30 hover:border-violet-400 transition-all hidden sm:block" style="color:#a78bfa;" data-i18n="nav_cta"></a>

  <!-- ══ HERO ══ -->
  <section class="hero-bg grid-bg relative min-h-screen flex flex-col items-center justify-center text-center px-6 pt-24 pb-20 overflow-hidden">
    <span class="kanji-bg" style="top:5%;left:-2%;transform:rotate(-15deg);color:var(--violet);">学</span>
    <span class="kanji-bg" style="bottom:5%;right:-2%;transform:rotate(10deg);color:var(--fuchsia);">遊</span>
    <div class="absolute w-64 h-64 rounded-full" style="top:20%;left:15%;background:radial-gradient(circle,rgba(139,92,246,.2) 0%,transparent 70%);animation:float 6s ease-in-out infinite;filter:blur(40px);"></div>
    <div class="absolute w-48 h-48 rounded-full" style="bottom:25%;right:10%;background:radial-gradient(circle,rgba(232,121,249,.2) 0%,transparent 70%);animation:float 8s ease-in-out infinite 2s;filter:blur(30px);"></div>

    <div class="inline-flex items-center gap-2 px-5 py-2 rounded-full mb-8 font-body text-sm font-600 border" style="border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.07);color:var(--cyan);">

      <span data-i18n="hero_badge"></span>

    <h1 class="font-pixel leading-relaxed mb-6 relative" style="font-size:clamp(1.6rem,4vw,3rem);">
      <span class="glitch-text block text-white" data-text="MANABU">MANABU</span>

      <div class="text-center"><p class="font-body text-sm text-slate-600 mb-1">Advertisement</p>
      <!-- ✦ PASTE YOUR GOOGLE ADSENSE CODE HERE (TOP BANNER) ✦ --></div>
    </div>
  </div>

  <!-- ══ FEATURES ══ -->
  <section id="features" class="py-20 px-6 max-w-5xl mx-auto">
    <div class="text-center mb-14 reveal">
      <p class="section-label" style="color:var(--cyan);" data-i18n="features_label"></p>
      <h2 class="pixel-heading-md mt-5 text-white" data-i18n="features_title"></h2>
      <p class="font-body text-lg text-slate-400 mt-5 max-w-xl mx-auto" data-i18n="features_sub"></p>
    </div>

  function applyLang() {
    document.getElementById('htmlRoot').lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t(el.dataset.i18n);
      if (typeof v === 'string') el.innerHTML = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPh);
    });
    document.getElementById('btnEN').classList.toggle('active', currentLang === 'en');
    document.getElementById('btnFR').classList.toggle('active', currentLang === 'fr');
    // Refresh copy button label if not in "copied" state
    const copyBtn = document.getElementById('shareBtnCopy');
    const copyLbl = document.getElementById('copyBtnLabel');
    if (copyBtn && copyLbl && !copyBtn.classList.contains('copied')) {
      copyLbl.textContent = t('result_share_copy');
    }
    // Refresh difficulty grid labels
    renderDiffGrid();
    // Update next button if mid-quiz
    const nb = document.getElementById('nextBtn');
    if (nb && !nb.classList.contains('opacity-0')) {
      nb.textContent = state.currentIndex >= state.questions.length - 1 ? t('see_results') : t('next_word');
    }
  }

  function setLang(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    LS.setLang(lang);
    const idx=state.currentIndex, sc=state.score, st=state.streak, bs=state.bestStreak;
    if (currentDiff) {
      state.questions = buildQuestions(currentDiff.words);
      state.currentIndex = Math.min(idx, state.questions.length - 1);
      state.score=sc; state.streak=st; state.bestStreak=bs; state.answered=false;
    }
    applyLang();
    if (document.getElementById('quizArea').style.display !== 'none') renderQuestion();
  }

  // ══════════════════════════════════════════════════════════════
  // QUIZ ENGINE
  // ══════════════════════════════════════════════════════════════
  let state = { questions:[], currentIndex:0, score:0, streak:0, bestStreak:0, answered:false, correct:0 };

  const shuffle = a => {
    const b=[...a];
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
    return b;
  };

  function buildQuestions(n) {
    const pool = shuffle(QUIZ_DATA).slice(0, n);
    return pool.map(q => {
      const correctText = q.correct[currentLang] || q.correct.en;
      const wrongList   = q.wrong[currentLang]   || q.wrong.en;
      const answers     = shuffle([correctText, ...shuffle(wrongList).slice(0,3)]);
      return { ...q, correctText, answers };
    });
  }

  // ── DIFFICULTY GRID ──────────────────────────────────────────
  function renderDiffGrid() {
    const grid = document.getElementById('diffGrid');
    if (!grid) return;
    grid.innerHTML = '';
    DIFFICULTIES.forEach(d => {
      const best = LS.getBest(d.id);
      const bestLabel = best > 0
        ? `${t('diff_best')} <span style="color:${d.color};font-weight:700;">${best} pts</span>`
        : `<span style="color:rgba(255,255,255,.3);">${t('diff_no_best')}</span>`;
      const card = document.createElement('div');
      card.className = `diff-card ${d.cls}${currentDiff?.id === d.id ? ' selected' : ''}`;
      card.innerHTML = `
        <span class="diff-icon">${d.icon}</span>
        <div class="diff-name" style="color:${d.color};">${t('diff_'+d.id)}</div>
        <div class="diff-count" style="color:rgba(255,255,255,.6);">${d.words} ${t('diff_words')}</div>
        <div class="diff-best mt-1" style="color:rgba(255,255,255,.5);">${bestLabel}</div>
      `;
      card.onclick = () => selectDiff(d);
      grid.appendChild(card);
    });
  }

  function selectDiff(d) {
    currentDiff = d;
    renderDiffGrid();
    const sb = document.getElementById('startBtn');
    sb.classList.add('ready');
  }

  function launchQuiz() {
    if (!currentDiff) return;
    state = { questions:buildQuestions(currentDiff.words), currentIndex:0, score:0, streak:0, bestStreak:0, answered:false, correct:0 };
    // Hide picker, show progress+hud+quiz
    document.getElementById('diffArea').style.display   = 'none';
    document.getElementById('progressRow').style.display = 'flex';
    document.getElementById('hudRow').style.display      = 'flex';
    document.getElementById('quizArea').style.display    = 'block';
    document.getElementById('resultsArea').style.display = 'none';
    renderQuestion();
  }

  function goToDiffPicker() {
    document.getElementById('diffArea').style.display    = 'block';
    document.getElementById('progressRow').style.display = 'none';
    document.getElementById('hudRow').style.display      = 'none';
    document.getElementById('quizArea').style.display    = 'none';
    document.getElementById('resultsArea').style.display = 'none';
    renderDiffGrid();
  }

  function replayDifficulty() {
    launchQuiz();
  }

  // ── HINT ─────────────────────────────────────────────────────
  function revealHint() {
    document.getElementById('hintBtn').style.display  = 'none';
    const zone    = document.getElementById('hintText');
    const content = document.getElementById('hintContent');
    zone.style.display = 'block';
    content.classList.remove('hint-revealed');
    void content.offsetWidth;
    content.classList.add('hint-revealed');
  }

  // ── RENDER QUESTION ──────────────────────────────────────────
  function renderQuestion() {
    const q     = state.questions[state.currentIndex];
    const total = state.questions.length;

    document.getElementById('progressBar').style.width  = `${(state.currentIndex/total)*100}%`;
    document.getElementById('progressText').textContent = `${state.currentIndex}/${total}`;

    document.getElementById('scoreDisplay').textContent  = state.score;
    document.getElementById('streakDisplay').textContent = state.streak >= 2 ? `🔥 x${state.streak}` : '';
    const level = state.score < 30 ? 'I' : state.score < 80 ? 'II' : state.score < 180 ? 'III' : 'IV';
    document.getElementById('levelDisplay').textContent  = level;

    document.getElementById('wordKana').textContent     = q.kana;
    document.getElementById('wordDisplay').textContent  = q.word;
    document.getElementById('wordCategory').textContent = q.cat[currentLang] || q.cat.en;

    // Reset hint
    const hintBtn     = document.getElementById('hintBtn');
    const hintText    = document.getElementById('hintText');
    const hintContent = document.getElementById('hintContent');
    hintBtn.style.display   = 'inline-flex';
    hintText.style.display  = 'none';
    hintContent.textContent = q.hint[currentLang] || q.hint.en;
    hintContent.classList.remove('hint-revealed');
    const hl = hintBtn.querySelector('[data-i18n]');
    if (hl) hl.textContent = t('hint_btn');

    // Answers
    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    q.answers.forEach(ans => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.innerHTML = `<span>${ans}</span>`;
      btn.onclick = () => handleAnswer(btn, ans, q.correctText);
      grid.appendChild(btn);
    });

    const fb = document.getElementById('feedback');
    fb.style.display='none'; fb.textContent='';
    const nb = document.getElementById('nextBtn');
    nb.classList.add('opacity-0','pointer-events-none');
    state.answered = false;
  }

  // ── HANDLE ANSWER ────────────────────────────────────────────
  function handleAnswer(btn, chosen, correct) {
    if (state.answered) return;
    state.answered = true;
    document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
    if (document.getElementById('hintText').style.display === 'none') revealHint();

    const isCorrect = chosen === correct;
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';

    if (isCorrect) {
      btn.classList.add('correct');
      state.streak++;
      state.correct++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      const bonus = state.streak>=3 ? 15 : state.streak>=2 ? 12 : 10;
      state.score += bonus;
      fb.style.color = 'var(--green)';
      fb.textContent = state.streak>=3 ? t('fb_combo')(state.streak,bonus) : t('fb_correct')(bonus);
      spawnParticles(btn, '#4ade80');
    } else {
      btn.classList.add('wrong');
      state.streak = 0;
      document.querySelectorAll('.answer-btn').forEach(b => {
        if (b.querySelector('span').textContent===correct) b.classList.add('correct');
      });
      fb.style.color = 'var(--red)';
      const shortAns = correct.split(' ').slice(0,7).join(' ')+(correct.split(' ').length>7?'…':'');
      fb.textContent = t('fb_wrong')(shortAns);
    }

    document.getElementById('scoreDisplay').textContent  = state.score;
    document.getElementById('streakDisplay').textContent = state.streak>=2 ? `🔥 x${state.streak}` : '';

    const nb = document.getElementById('nextBtn');
    nb.classList.remove('opacity-0','pointer-events-none');
    nb.textContent = state.currentIndex>=state.questions.length-1 ? t('see_results') : t('next_word');
  }

  function nextQuestion() {
    state.currentIndex++;
    if (state.currentIndex >= state.questions.length) showResults();
    else renderQuestion();
  }

  // ── RESULTS ──────────────────────────────────────────────────
  function showResults() {
    document.getElementById('progressRow').style.display = 'none';
    document.getElementById('hudRow').style.display      = 'none';
    document.getElementById('quizArea').style.display    = 'none';
    document.getElementById('resultsArea').style.display = 'block';

    const total = state.questions.length;
    const pct   = Math.round((state.score/(total*15))*100);
    const tier  = t('results').find(r=>pct>=r.min) || t('results')[t('results').length-1];

    document.getElementById('finalEmoji').textContent   = tier.emoji;
    document.getElementById('finalTitle').textContent   = tier.title;
    document.getElementById('finalMsg').textContent     = tier.msg;
    document.getElementById('finalScore').textContent   = state.score + ' pts';
    document.getElementById('finalCorrect').textContent = `${state.correct}/${total}`;
    document.getElementById('finalPercent').textContent = pct+'%';
    document.getElementById('finalStreak').textContent  = state.bestStreak;
    document.getElementById('progressBar').style.width  = '100%';
    document.getElementById('progressText').textContent = `${total}/${total}`;

    // localStorage — save best & show badge/msg
    const isNewRecord = LS.setBest(currentDiff.id, state.score);
    const badge = document.getElementById('newRecordBadge');
    badge.style.display = isNewRecord ? 'block' : 'none';

    const bestMsg = document.getElementById('bestScoreMsg');
    const currentBest = LS.getBest(currentDiff.id);
    const diffLabel = t('diff_'+currentDiff.id);
    bestMsg.innerHTML = t('result_best_msg')(currentBest, diffLabel);

    // Refresh diff grid best scores for next visit
    renderDiffGrid();
  }

  // ── PARTICLES ────────────────────────────────────────────────
  function spawnParticles(btn, color) {
    const r=btn.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(let i=0;i<8;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.cssText=`left:${cx}px;top:${cy}px;background:${color};--tx:${(Math.random()-.5)*120}px;--ty:${(Math.random()-.8)*100}px;`;
      document.body.appendChild(p);
      p.addEventListener('animationend',()=>p.remove());
    }
  }

  // ── EMAIL → NETLIFY FORMS ────────────────────────────────────
  async function handleEmailSubmit(e) {
    e.preventDefault();
    const form    = e.target;
    const email   = document.getElementById('emailInput').value.trim();
    const btn     = form.querySelector('button[type="submit"]');
    const success = document.getElementById('emailSuccess');

    // Optimistic UI — disable button while sending
    const originalText = btn.textContent;
    btn.disabled   = true;
    btn.textContent = '...';

    try {
      const body = new URLSearchParams({
        'form-name': 'manabuplay-waitlist',
        'email':     email,
        'lang':      currentLang,
      });

      const res = await fetch('/', {
        method:  'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body:    body.toString(),
      });

      if (res.ok) {
        form.style.display      = 'none';
        success.style.display   = 'block';
        // Also store locally so we don't show the form again this session
        LS.set('email_submitted', true);
      } else {
        throw new Error('Network response was not ok');
      }
    } catch (err) {
      // Graceful fallback — show success anyway (Netlify may still catch it)
      // and log the error silently
      console.warn('Netlify form submit error:', err);
      btn.disabled    = false;
      btn.textContent = originalText;
      // Show a soft error message
      success.style.display = 'block';
      success.querySelector('span').textContent =
        currentLang === 'fr'
          ? '⚠ Réessaie dans un instant…'
          : '⚠ Something went wrong, please retry.';
    }
  }

  // ── SCROLL REVEAL ─────────────────────────────────────────────
  const revealObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');revealObs.unobserve(e.target);}});
  },{threshold:0.1});
  document.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));

  // ── SHARE ─────────────────────────────────────────────────────
  function buildShareText() {
    const total     = state.questions.length;
    const pct       = Math.round((state.score / (total * 15)) * 100);
    const diffLabel = t('diff_' + currentDiff.id);
    const tier      = t('results').find(r => pct >= r.min) || t('results')[t('results').length - 1];
    // Emoji bar: filled squares proportional to accuracy
    const filled  = Math.round(pct / 10);
    const bar     = '🟪'.repeat(filled) + '⬛'.repeat(10 - filled);
    return currentLang === 'fr'
      ? `${tier.emoji} ManabuPlay — Quiz Gaming Japonais\nDifficulté : ${diffLabel} | ${state.correct}/${total} réponses justes\nScore : ${state.score} pts (${pct}%)\n${bar}\nTeste ton niveau 👇`
      : `${tier.emoji} ManabuPlay — Japanese Gaming Quiz\nDifficulty: ${diffLabel} | ${state.correct}/${total} correct\nScore: ${state.score} pts (${pct}%)\n${bar}\nTest your level 👇`;
  }

  function shareOnX() {
    const text = buildShareText();
    const url  = encodeURIComponent(window.location.href.split('#')[0]);
    const tweet = encodeURIComponent(text + '\n' + decodeURIComponent(url));
    window.open('https://x.com/intent/tweet?text=' + tweet, '_blank', 'noopener,width=600,height=500');
  }

  function copyShareLink() {
    const text = buildShareText() + '\n' + window.location.href.split('#')[0];
    const btn  = document.getElementById('shareBtnCopy');
    const lbl  = document.getElementById('copyBtnLabel');
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      lbl.textContent = t('result_share_copied');
      setTimeout(() => {
        btn.classList.remove('copied');
        lbl.textContent = t('result_share_copy');
      }, 2200);
    }).catch(() => {
      // Fallback for browsers without clipboard API
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.classList.add('copied');
      lbl.textContent = t('result_share_copied');
      setTimeout(() => { btn.classList.remove('copied'); lbl.textContent = t('result_share_copy'); }, 2200);
    });
  }

  // ── BOOT ─────────────────────────────────────────────────────
  applyLang();        // uses saved lang from LS
  renderDiffGrid();   // show difficulty picker
  // If email already submitted this session, show success directly
  if (LS.get('email_submitted')) {
    const f = document.querySelector('form[name="manabuplay-waitlist"]');
    const s = document.getElementById('emailSuccess');
    if (f) f.style.display = 'none';
    if (s) s.style.display = 'block';
  }
  </script>
</body>
</html>
